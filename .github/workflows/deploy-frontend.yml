name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Debug - List source files
        run: |
          echo "Checking for vite-env.d.ts:"
          ls -la src/*.d.ts || echo "No .d.ts files found"
          echo "Checking lib directory:"
          ls -la src/lib/ || echo "No lib directory"
      
      - name: Resolve build-time env (Variables or Secrets)
        id: build_env
        run: |
          API_URL="${{ vars.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="${{ secrets.VITE_API_URL }}"
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::Set VITE_API_URL as an Actions Variable or Secret (backend origin, e.g. https://signhouse-v3-mcp.it9up.com — no /api suffix)."
            exit 1
          fi
          MCP_URL="${{ vars.VITE_MCP_PUBLIC_URL }}"
          if [ -z "$MCP_URL" ]; then
            MCP_URL="${{ secrets.VITE_MCP_PUBLIC_URL }}"
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "mcp_url=$MCP_URL" >> "$GITHUB_OUTPUT"
          echo "VITE_API_URL is set (length ${#API_URL})"

      - name: Build frontend
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          VITE_BASE_PATH: /sign-house-v3-mcp/
          VITE_API_URL: ${{ steps.build_env.outputs.api_url }}
          VITE_MCP_PUBLIC_URL: ${{ steps.build_env.outputs.mcp_url }}
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

